<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 대기실 </title>
    <style>
        /* 전체 배경 및 레이아웃 설정 */
        body { 
            background-color: #5c4d50; 
            color: white; 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .lobby-container { 
            width: 900px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* 상단: 플레이어 4명 영역 */
        .player-section { display: flex; justify-content: space-between; gap: 10px; }
        .player-card { 
            flex: 1; 
            border: 4px solid #999; 
            display: flex; 
            flex-direction: column; 
            height: 450px; 
            background-color: #4a3f41;
        }
        .player-portrait { 
            background-color: white; 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: black; 
            border-bottom: 2px solid #999; 
        }
        .player-name { 
            background-color: #eee; 
            color: black; 
            text-align: center; 
            padding: 5px; 
            font-weight: bold; 
            border-bottom: 2px solid #999; 
        }
        .player-deck-info { 
            background-color: #ddd; 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #333; 
        }

        /* 하단: 컨트롤 영역 (채팅, 방코드, 버튼) */
        .control-section { display: flex; height: 200px; gap: 10px; }
        
        /* 채팅 박스 */
        .chat-area { flex: 2; display: flex; flex-direction: column; border: 2px solid #a2f2a2; }
        .chat-display { 
            flex: 3; 
            background-color: #ff8c00; 
            padding: 10px; 
            overflow-y: auto; 
            font-size: 18px; 
            font-weight: bold; 
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .chat-input-box { flex: 1; background-color: white; padding: 5px; }
        .chat-input-box input { 
            width: 100%; 
            height: 100%; 
            border: none; 
            font-size: 18px; 
            outline: none; 
            padding-left: 10px;
        }

        /* 방 코드 박스 */
        .code-area { flex: 1; display: flex; flex-direction: column; border: 2px solid #99f; }
        .code-label { 
            flex: 1; 
            background-color: white; 
            color: black; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: bold;
        }
        .code-value { 
            flex: 1; 
            background-color: #d66d75; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            font-weight: bold; 
        }

        /* 버튼 영역 */
        .button-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .btn { 
            border: none; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s; 
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.98); }
        .ready-btn { flex: 2; background-color: #a2f2a2; color: black; }
        .exit-btn { flex: 1; background-color: #8e44ad; color: white; }
    </style>
</head>
<body>

<div class="lobby-container">
    <div class="player-section">
        <c:forEach var="i" begin="1" end="4">
            <div class="player-card">
                <div class="player-portrait">
                    <img src="" alt="Portrait" onerror="this.src='https://via.placeholder.com/150?text=Hero'">
                </div>
                <div class="player-name">
                    <c:choose>
                        <c:when test="${i == 1}">(방장)</c:when>
                        <c:otherwise>비어 있음</c:otherwise>
                    </c:choose>
                </div>
                <div class="player-deck-info">준비 대기 중...</div>
            </div>
        </c:forEach>
    </div>

    <div class="control-section">
        <div class="chat-area">
            <div class="chat-display" id="chatDisplay">
                [시스템] 대기실에 입장하셨습니다.
            </div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="메시지를 입력하고 엔터를 누르세요">
            </div>
        </div>

        <div class="code-area">
            <div class="code-label">ROOM CODE</div>
            <div class="code-value">${l.lobbyCode}</div>
        </div>

        <div class="button-area">
            <button class="btn ready-btn" onclick="toggleReady()">
                <c:choose>
                    <c:when test="${loginUser.userId eq l.masterId}">게임 시작</c:when>
                    <c:otherwise>준비 완료</c:otherwise>
                </c:choose>
            </button>
            <button class="btn exit-btn" onclick="exitLobby()">로비 나가기</button>
        </div>
    </div>
</div>

<script>
    // 채팅 입력 엔터 이벤트
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            const display = document.getElementById('chatDisplay');
            display.innerHTML += `<div><strong>${loginUser.userId}:</strong> \${this.value}</div>`;
            this.value = "";
            display.scrollTop = display.scrollHeight;
        }
    });

    // 나가기 버튼
    function exitLobby() {
        if(confirm("정말로 로비에서 나가시겠습니까?")) {
            location.href = "${pageContext.request.contextPath}/Lobby/list";
        }
    }

    // 준비 버튼 (추후 웹소켓 연동 필요)
    function toggleReady() {
        alert("준비 기능을 구현 중입니다.");
    }
</script>

</body>
</html>
